<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown Preview</title>

    <!-- KaTeX for LaTeX math rendering -->
    <link rel="stylesheet" href="./vendor/katex/katex.min.css">

    <!-- Highlight.js for syntax highlighting -->
    <link rel="stylesheet" href="./vendor/hljs/atom-one-dark.min.css">

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            line-height: 1.6;
            color: {{ON_BACKGROUND_COLOR}};
            max-width: 100%;
            margin: 0;
            padding: 16px;
            background: {{BACKGROUND_COLOR}};
        }

        /* Responsive design */
        @media (min-width: 768px) {
            body {
                max-width: 800px;
                margin: 0 auto;
                padding: 24px;
            }
        }

        /* Typography */
        h1 { margin-top: 24px; margin-bottom: 16px; font-weight: 600; line-height: 1.25; font-size: 2em; border-bottom: 1px solid {{OUTLINE_VARIANT_COLOR}}; padding-bottom: 8px; }
        h2 { margin-top: 20px; margin-bottom: 14px; font-weight: 600; line-height: 1.25; font-size: 1.75em; border-bottom: 1px solid {{OUTLINE_VARIANT_COLOR}}; padding-bottom: 8px; }
        h3 { margin-top: 18px; margin-bottom: 12px; font-weight: 600; line-height: 1.25; font-size: 1.5em; }
        h4 { margin-top: 16px; margin-bottom: 10px; font-weight: 600; line-height: 1.25; font-size: 1.25em; }
        h5 { margin-top: 14px; margin-bottom: 8px; font-weight: 600; line-height: 1.25; font-size: 1.1em; }
        h6 { margin-top: 12px; margin-bottom: 6px; font-weight: 600; line-height: 1.25; font-size: 1em; color: {{ON_SURFACE_VARIANT_COLOR}}; }

        p {
            margin-bottom: 16px;
        }

        /* Code styling */
        code {
            background: {{SURFACE_VARIANT_COLOR}};
            border-radius: 3px;
            font-size: 85%;
            margin: 0;
            padding: 0.2em 0.4em;
            font-family: 'SF Mono', Monaco, Inconsolata, 'Roboto Mono', monospace;
        }

        pre {
            background: {{SURFACE_VARIANT_COLOR}};
            border-radius: 6px;
            font-size: 85%;
            line-height: 1.45;
            overflow: auto;
            padding: 16px;
            margin-bottom: 16px;
        }

        pre code {
            background: transparent;
            border: 0;
            display: inline;
            line-height: inherit;
            margin: 0;
            overflow: visible;
            padding: 0;
            word-wrap: normal;
        }

        /* Tables */
        table {
            border-collapse: collapse;
            border-spacing: 0;
            width: 100%;
            margin-bottom: 16px;
        }

        table th, table td {
            border: 1px solid {{OUTLINE_VARIANT_COLOR}};
            padding: 6px 13px;
        }

        table th {
            background: {{SURFACE_VARIANT_COLOR}};
            font-weight: 600;
        }

        table tr:nth-child(2n) {
            background: {{SURFACE_VARIANT_COLOR}};
        }

        /* Lists */
        ul, ol {
            margin-bottom: 16px;
            padding-left: 2em;
        }

        li {
            margin-bottom: 4px;
        }

        /* Blockquotes */
        blockquote {
            border-left: 4px solid {{OUTLINE_VARIANT_COLOR}};
            color: {{ON_SURFACE_VARIANT_COLOR}};
            margin: 0 0 16px 0;
            padding: 0 16px;
        }

        /* Links */
        a {
            color: {{PRIMARY_COLOR}};
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        /* Images */
        img {
            max-width: 100%;
            height: auto;
            border-radius: 6px;
            margin: 8px 0;
        }

        /* Horizontal rules */
        hr {
            background: {{OUTLINE_VARIANT_COLOR}};
            border: 0;
            height: 1px;
            margin: 24px 0;
        }

        /* KaTeX math */
        .katex {
            font-size: 1.1em;
        }

        .katex-display {
            margin: 16px 0;
            overflow-x: auto;
        }

        /* Mermaid diagrams */
        .mermaid {
            text-align: center;
            margin: 16px 0;
        }

        /* Task lists */
        .task-list-item {
            list-style-type: none;
        }

        .task-list-item input[type="checkbox"] {
            margin-right: 8px;
        }

        /* Theme colors are dynamically replaced by the Android app */
    </style>
</head>
<body>
    <div id="content"></div>

    <!-- v5.3.17 ★★★ 全部依赖本地化（用户要求「把 Codex 那套渲染库放回本地」）。
         此前这 8 个依赖全部从 esm.sh / cdn.jsdelivr.net 远程加载：断网、弱网、
         或被墙时整页渲染直接失败（连表格都出不来），且每次打开都要走一次网络。
         现在全部来自 assets/html/vendor/，零网络请求。

         为什么用 UMD 普通 script 而不是 ESM import：
         - katex / markdown-it / highlight.js / js-base64 / task-lists 的官方发布都是 UMD，
           挂到 window.* 后由下面的 script 直接取用，不需要打包器；
         - mermaid.min.js 虽然是 esbuild 的 ESM 产物，但它末尾自带
           `globalThis["mermaid"] = ...default`，同样以普通 script 即可用；
         - 去掉 type="module" 后不再受 ES Module 加载时序影响，脚本顺序即依赖顺序，
           比原来的远程 ESM 更可预测。 -->
    <script src="./vendor/katex/katex.min.js"></script>
    <!-- mhchem 必须在 katex 之后：它检测全局 katex 并扩展 \ce{} 语法 -->
    <script src="./vendor/katex/mhchem.min.js"></script>
    <script src="./vendor/markdown-it/markdown-it.min.js"></script>
    <script src="./vendor/markdown-it-task-lists.js"></script>
    <script src="./vendor/hljs/hljs.min.js"></script>
    <script src="./vendor/js-base64/base64.min.js"></script>
    <script src="./mermaid.min.js"></script>
    <!-- v5.3.17：math 插件独立成文件（可被 node 单测直接 require，见 tools/test-mark-render.js） -->
    <script src="./vendor/math-plugin.js"></script>

    <script>
        // ── 从本地 UMD 取库（替代原来的 8 个 esm.sh import）──
        const MarkdownIt = window.markdownit;
        const markdownItTaskLists = window.markdownitTaskLists;
        const katex = window.katex;
        const hljs = window.hljs;
        const mermaid = window.mermaid;
        const Base64 = window.Base64;

        if (!MarkdownIt || !katex || !hljs || !Base64) {
            document.body.innerHTML = '<p style="color:#cc0000;font-family:monospace">' +
                '本地渲染资源加载失败：markdown-it=' + !!MarkdownIt +
                ' katex=' + !!katex + ' hljs=' + !!hljs + ' base64=' + !!Base64 +
                '</p>';
            throw new Error('local vendor assets missing');
        }

        // math 插件来自 ./vendor/math-plugin.js（本地文件，见上方 script 引用）

        // Configure markdown-it
        const md = new MarkdownIt({
            html: true,         // Enable HTML tags in source
            xhtmlOut: false,    // Use '/' to close single tags (<br />)
            breaks: false,      // Convert '\n' in paragraphs into <br>
            langPrefix: 'language-',  // CSS language prefix for fenced blocks
            linkify: true,      // Autoconvert URL-like text to links
            typographer: true,  // Enable some language-neutral replacement + quotes beautification
            quotes: '“”‘’',     // Quote chars
            highlight: function (str, lang) {
                if (lang && hljs.getLanguage(lang)) {
                    try {
                        return '<pre class="hljs"><code>' +
                               hljs.highlight(str, { language: lang, ignoreIllegals: true }).value +
                               '</code></pre>';
                    } catch (__) {}
                }
                return '<pre class="hljs"><code>' + md.utils.escapeHtml(str) + '</code></pre>';
            }
        });

        // Add plugins
        // v5.3.17：本地 math 插件（见上文 mathPlugin），不再依赖 @vscode/markdown-it-katex
        md.use(mathPlugin);

        md.use(markdownItTaskLists, {
            enabled: true,
            label: true,
            labelAfter: true
        });

        // Add custom renderer for mermaid
        const defaultFenceRenderer = md.renderer.rules.fence || function(tokens, idx, options, env, renderer) {
            return renderer.renderToken(tokens, idx, options);
        };

        md.renderer.rules.fence = function(tokens, idx, options, env, renderer) {
            const token = tokens[idx];
            const info = token.info ? md.utils.unescapeAll(token.info).trim() : '';

            if (info === 'mermaid') {
                const id = 'mermaid-' + Math.random().toString(36).substr(2, 9);
                return `<div class="mermaid" id="${id}">${token.content.trim()}</div>\n`;
            }

            return defaultFenceRenderer(tokens, idx, options, env, renderer);
        };

        // Configure mermaid
        mermaid.initialize({
            startOnLoad: false,
            theme: window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'default',
            securityLevel: 'loose',
            fontFamily: 'inherit'
        });

        // The markdown content to render (base64 encoded)
        const markdownBase64 = `{{MARKDOWN_BASE64}}`;
        let markdownContent = Base64.decode(markdownBase64);

        // Convert \[ ... \] to $$ ... $$ for LaTeX block math
        markdownContent = markdownContent.replace(/\\\[([\s\S]*?)\\\]/g, (match, content) => {
            return '\n$$\n' + content.trim() + '\n$$\n';
        });
        // Convert \( ... \) to $ ... $ for LaTeX inline math
        markdownContent = markdownContent.replace(/\\\(([\s\S]*?)\\\)/g, '$$$1$$');

        // Render markdown with markdown-it
        async function renderMarkdown() {
            try {
                // Process with markdown-it
                const html = md.render(markdownContent);
                document.getElementById('content').innerHTML = html;

                // Render mermaid diagrams
                const mermaidElements = document.querySelectorAll('.mermaid');
                if (mermaidElements.length > 0) {
                    await mermaid.run({
                        nodes: mermaidElements
                    });
                }

                // Render KaTeX math
                // v5.3.1 ★剥离 pdfLaTeX 间距参数：`\\[2pt]` / `\\[6pt]` 是排版参数，
                // 不是数学内容，KaTeX 不认 → 会原样显示成正文（用户缺陷三）。
                const normalizeLatex = (src) =>
                    src.replace(/\\\\\[\s*[\d.]+\s*(?:pt|mm|cm|in|ex|em|mu)\s*\]/g, '\\\\');

                // v5.3.0 ★用户要求：KaTeX 不认的写法（如 \begin{cases} 里的 \\[2pt]）
                // 绝不"硬排"成正文。throwOnError=true 会抛异常 → 这里必须把**原文**红色回填，
                // 否则公式会整段消失（比显示 [2pt] 更糟）。
                document.querySelectorAll('.math.inline').forEach(el => {
                    const src = normalizeLatex(el.textContent);
                    try {
                        katex.render(src, el, {
                            throwOnError: true,
                            errorColor: '#cc0000',
                            trust: true
                        });
                    } catch (e) {
                        el.textContent = src;
                        el.style.color = '#cc0000';
                        el.style.fontFamily = 'monospace';
                        el.title = 'LaTeX 渲染失败：' + (e && e.message ? e.message : e);
                        console.warn('KaTeX inline render error:', e);
                    }
                });

                document.querySelectorAll('.math.block').forEach(el => {
                    const src = normalizeLatex(el.textContent);
                    try {
                        katex.render(src, el, {
                            displayMode: true,
                            throwOnError: true,
                            errorColor: '#cc0000',
                            trust: true
                        });
                    } catch (e) {
                        el.textContent = src;
                        el.style.color = '#cc0000';
                        el.style.fontFamily = 'monospace';
                        el.style.whiteSpace = 'pre-wrap';
                        el.title = 'LaTeX 渲染失败：' + (e && e.message ? e.message : e);
                        console.warn('KaTeX block render error:', e);
                    }
                });

                // Handle external links
                document.querySelectorAll('a[href^="http"]').forEach(link => {
                    link.target = '_blank';
                    link.rel = 'noopener noreferrer';
                });
            } catch (error) {
                console.error('Error rendering markdown:', error);
                document.getElementById('content').innerHTML = '<p>Error rendering markdown content: ' + error.message + '</p>';
            }
        }

        // Call the render function
        renderMarkdown();
    </script>
</body>
</html>
