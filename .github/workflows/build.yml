# RinCore 单一发布链（v3 · 2026-10-21 精简提速版）
#
# 设计目标（用户定版）：
#   一次 push main = 编译门禁 → 测试 → 打包 → 发布；任何一步失败立即中止
#
# v3 相对 v2 的删减（都是纯浪费，实测可省 4-6 分钟）：
#   ✂ web-ui + pnpm install —— web-ui 目录存在 1.3M，但 settings.gradle.kts 根本没 include，
#                                app 不依赖它，Gradle 从不读 ⇒ 纯白花 1-2 分钟
#   ✂ NDK 28 —— 全项目无 externalNativeBuild / ndkVersion / cmake ⇒ 纯白花 2-3 分钟
#   ✂ platforms;android-36 —— compileSdk = 37，36 从未被使用
#   ✂ checkout fetch-depth:0 —— 只需最近一次提交写 release notes
#   ✂ 分三次 Gradle 调用 —— 合并为一次（省 2 次 JVM 冷启动 ≈60-90s）
#
# 门禁任务改为 :app:compileResearchKotlin（与 assembleResearch 同变体，避免重复编译 Release）
name: Build & Release

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'
      - 'knowledge/**'
      - 'archive/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      # web-ui 是 :web 模块 buildWebUi 任务的输入，而 app 依赖 :web → pnpm 必须保留
      - name: Setup Node.js + pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install web-ui deps
        run: cd web-ui && pnpm install --frozen-lockfile 2>/dev/null || pnpm install --no-frozen-lockfile

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        continue-on-error: true

      - name: Install SDK components
        run: |
          export PATH="$(ls -d $ANDROID_HOME/cmdline-tools/*/bin | head -1):$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          # 已安装的组件 sdkmanager 会返回非 0；这里只补缺，不因"已存在"失败
          sdkmanager "platforms;android-37" "build-tools;37.0.0" "platform-tools" || true
          echo "--- installed platforms ---"
          sdkmanager --list_installed 2>/dev/null | head -20 || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Prepare dummy google-services.json (CI only)
        run: |
          if [ ! -f app/google-services.json ]; then
            printf '%s' '{"project_info":{"project_number":"0","project_id":"dev-oracle","storage_bucket":"dev-oracle.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:0:android:0","android_client_info":{"package_name":"me.rerere.rikkahub"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyDUMMY"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > app/google-services.json
          fi

      - name: Create signing config
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ] || [ -z "${{ secrets.KEYSTORE_PASSWORD }}" ]; then
            echo "::warning::KEYSTORE secrets 未配置, 跳过 release 签名"
            printf 'storeFile=\nstorePassword=\nkeyAlias=\nkeyPassword=\n' > local.properties
          else
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release-key.jks
            printf 'storeFile=../app/release-key.jks\nstorePassword=%s\nkeyAlias=rincore\nkeyPassword=%s\n' "${{ secrets.KEYSTORE_PASSWORD }}" "${{ secrets.KEYSTORE_PASSWORD }}" > local.properties
          fi

      - name: Version check
        run: |
          VN=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "versionName=$VN"
          [ -n "$VN" ] || (echo "::error::versionName 为空" && exit 1)

      # ★ v5.3.17 新增：mark.html 本地化后的端到端渲染验证（纯 node，约 1-2 秒）
      #   背景：CI 只编译 Kotlin/Java，**从不执行 WebView 里的 JS**。v5.3.15（\xRightarrow
      #   静默 0×0）与 v5.3.16（\ + \dfrac13 解析失败）两次公式缺陷都发生在一侧，
      #   每次都是用户装上手机才发现。这一步用 node 加载**真实打包进 assets 的文件**
      #   （markdown-it / katex / math-plugin / js-base64），把 mark.html 的
      #   「markdown-it 渲染 → 提取公式占位 → katex.renderToString」完整跑一遍，
      #   并校验零远程依赖、字体齐全、script/CSS 指向真实存在的本地文件。
      - name: Render check (mark.html local assets)
        run: node tools/test-mark-render.js

      # ★ 单次 Gradle 调用：编译门禁 → 单元测试 → 打包（增量复用，失败立即中止）
      #   --console=plain 让 `e:` 行直接出现在日志，便于外部脚本秒抓错误
      #
      # v5.3.10 ★★★关键修正：此前这里**只编译不测试** app 模块 ——
      #   `:app:compileResearchKotlin` 只编译 main 源码，`app/src/test` 下 681 个
      #   @Test 从未被执行（`:ai:compileDebugUnitTestKotlin` 也只是"编译测试"）。
      #   后果：测试代码与生产代码长期脱节（如 FakeMemoryDAO 早在 v5.3.7 统一记忆后
      #   就编译不过：构造签名从单参变双参、MemoryFileDAO 多了 7 个方法），却无人发现；
      #   所有运行期 bug 只能等用户装上手机才暴露。
      #   v5.3.10 先以**独立非阻塞 job**（见文件末尾 unit-tests）把测试真正跑起来：
      #   `app/src/test` 有 56 个文件长期未编译，接通后立刻暴露大批腐化（会话层测试
      #   与被重写 3 次的 ConversationSession 完全脱节）。修完再升级为硬门禁。
      - name: Build (compile → test → assemble)
        run: |
          ./gradlew \
            :app:compileResearchKotlin \
            :ai:compileDebugUnitTestKotlin \
            :markdown:test \
            assembleResearch \
            --no-daemon --stacktrace --build-cache --parallel --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: rincore-release
          path: app/build/outputs/apk/research/*.apk
          retention-days: 7

      - name: Compute version and notes path
        if: github.ref == 'refs/heads/main'
        run: |
          VN=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "VN=$VN" >> "$GITHUB_ENV"
          if [ -s docs/RELEASE-NOTES.md ]; then
            echo "BODY_FILE=docs/RELEASE-NOTES.md" >> "$GITHUB_ENV"
          else
            {
              echo "## RinCore v$VN"
              echo ""
              echo "### 本次提交"
              git log --oneline -5 | sed 's/^/- /'
              echo ""
              echo "> 自动构建发布 · APK 见下方 Assets"
            } > "$RUNNER_TEMP/release-notes.md"
            echo "BODY_FILE=$RUNNER_TEMP/release-notes.md" >> "$GITHUB_ENV"
          fi

      - name: Publish Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VN }}
          name: RinCore v${{ env.VN }}
          body_path: ${{ env.BODY_FILE }}
          files: app/build/outputs/apk/research/*.apk
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true

  # ══════════════════════════════════════════════════════════════════════════
  # v5.3.10 ★★★ app 模块单元测试（独立、非阻塞）
  #
  # 背景：此前 build.yml 只跑 :app:compileResearchKotlin（仅 main 源码）+
  # :ai:compileDebugUnitTestKotlin（只是"编译"测试）+ :markdown:test，
  # app/src/test 下 681 个 @Test **从未被执行**。接通后发现测试已大面积腐化
  # （会话层测试与被重写 3 次的 ConversationSession 完全脱节）。
  # 先用 continue-on-error 让它持续可见、不阻塞发版；修完提升为硬门禁。
  # ══════════════════════════════════════════════════════════════════════════
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Node.js + pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install web-ui deps
        run: cd web-ui && pnpm install --frozen-lockfile 2>/dev/null || pnpm install --no-frozen-lockfile

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        continue-on-error: true

      - name: Install SDK components
        run: |
          export PATH="$(ls -d $ANDROID_HOME/cmdline-tools/*/bin | head -1):$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-37" "build-tools;37.0.0" "platform-tools" || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Run app unit tests
        # v5.3.10：step 级 continue-on-error（GitHub Actions 只在 step 上支持该语义；
        # 写在 job 上无效 —— 会导致整个 run 判红、阻断 release 判定）→ 测试失败可见但不卡发布。
        continue-on-error: true
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace --console=plain
