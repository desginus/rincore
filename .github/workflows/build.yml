name: Build RinCore APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Node.js + pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install web-ui dependencies
        run: cd web-ui && pnpm install --no-frozen-lockfile

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install SDK components
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          sdkmanager "ndk;28.2.13676358" 2>/dev/null || true

      - name: Create signing config
        run: |
          # v3.8.30 安全收尾: 签名密钥移出仓库, 从 GitHub Secrets 注入
          # (仓库内不再存放任何 jks; secrets 未配置时跳过签名构建)
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ] || [ -z "${{ secrets.KEYSTORE_PASSWORD }}" ]; then
            echo "::warning::KEYSTORE secrets 未配置, 跳过 release 签名"
            printf 'storeFile=\nstorePassword=\nkeyAlias=\nkeyPassword=\n' > local.properties
          else
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release-key.jks
            printf 'storeFile=../app/release-key.jks\nstorePassword=%s\nkeyAlias=rincore\nkeyPassword=%s\n' "${{ secrets.KEYSTORE_PASSWORD }}" "${{ secrets.KEYSTORE_PASSWORD }}" > local.properties
          fi

      - name: Build Release APK
        run: |
          # v3.8.45: 双产品线 — assembleRelease 构建 rincore + waterhub 两个 flavor
          ./gradlew assembleRelease --no-daemon --stacktrace
          ls -la app/build/outputs/apk/

      - name: Upload RinCore APK (A 类主线)
        uses: actions/upload-artifact@v6
        with:
          name: rincore-release
          path: app/build/outputs/apk/rincore/release/*.apk
          retention-days: 7

      - name: Upload WaterHub APK (B 类产品线)
        uses: actions/upload-artifact@v6
        with:
          name: waterhub-release
          path: app/build/outputs/apk/waterhub/release/*.apk
          retention-days: 7
