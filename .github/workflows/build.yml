# RinCore 单一发布链（2026-10-20 v2：单 job + Gradle 缓存）
#
# 设计目标（用户定版）：
#   一次 push main = 编译门禁 → 测试 → assembleRelease → 正式版 Release
#   单 job：只 checkout/装 SDK/pnpm 一次（旧三 job 各准备一次 = 白花 6-8 分钟）
#   Gradle 缓存：第二次起省 3-5 分钟依赖下载/解压
#   实测目标：≈12-15min 出正式版（旧 20min+）
name: Build & Release

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'
      - 'knowledge/**'
      - 'archive/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Node.js + pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install web-ui deps
        run: cd web-ui && pnpm install --no-frozen-lockfile

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        continue-on-error: true

      - name: Install SDK components
        run: |
          export PATH="$(ls -d $ANDROID_HOME/cmdline-tools/*/bin | head -1):$PATH"
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" || true
          sdkmanager "platforms;android-37" "build-tools;37.0.0" 2>/dev/null || true
          sdkmanager "ndk;28.2.13676358" 2>/dev/null || true

      # ★ 关键提速项：Gradle 依赖与 wrapper 缓存（第二次起省 3-5 分钟）
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Prepare dummy google-services.json (CI only)
        run: |
          if [ ! -f app/google-services.json ]; then
            printf '%s' '{"project_info":{"project_number":"0","project_id":"dev-oracle","storage_bucket":"dev-oracle.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:0:android:0","android_client_info":{"package_name":"me.rerere.rikkahub"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyDUMMY"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > app/google-services.json
          fi

      - name: Create signing config
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ] || [ -z "${{ secrets.KEYSTORE_PASSWORD }}" ]; then
            echo "::warning::KEYSTORE secrets 未配置, 跳过 release 签名"
            printf 'storeFile=\nstorePassword=\nkeyAlias=\nkeyPassword=\n' > local.properties
          else
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release-key.jks
            printf 'storeFile=../app/release-key.jks\nstorePassword=%s\nkeyAlias=rincore\nkeyPassword=%s\n' "${{ secrets.KEYSTORE_PASSWORD }}" "${{ secrets.KEYSTORE_PASSWORD }}" > local.properties
          fi

      - name: Version check
        run: |
          VN=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          VC=$(grep -oP 'versionCode\s*=\s*\K\d+' app/build.gradle.kts || echo "?")
          echo "versionName=$VN versionCode=$VC"
          [ -n "$VN" ] || (echo "::error::versionName 为空" && exit 1)
          if git ls-remote --tags origin "refs/tags/v$VN" | grep -q .; then
            echo "::warning::tag v$VN 已存在（同版重推），Release 将被更新"
          fi

      # 门禁（任一失败即中止，不会进入打包）
      - name: Release gates (compile + tests)
        # v5.0.21 编译提速：三个任务合并为一次 Gradle 启动（省 2 次冷启动 ≈60-90s）+ 构建缓存
        run: |
          ./gradlew :ai:compileDebugUnitTestKotlin :markdown:testDebugUnitTest :app:compileReleaseKotlin \
            --no-daemon --stacktrace --build-cache --parallel

      - name: Build APK (research 构建配置 · 同包名顶替正式版)
        run: ./gradlew assembleResearch --no-daemon --stacktrace --build-cache --parallel

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: rincore-release
          path: app/build/outputs/apk/research/*.apk
          retention-days: 7

      - name: Compute version and notes path
        if: github.ref == 'refs/heads/main'
        run: |
          VN=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "VN=$VN" >> "$GITHUB_ENV"
          echo "TEST_TAG=v${VN}-test" >> "$GITHUB_ENV"
          if [ -s docs/RELEASE-NOTES.md ]; then
            echo "BODY_FILE=docs/RELEASE-NOTES.md" >> "$GITHUB_ENV"
          else
            {
              echo "## RinCore v$VN"
              echo ""
              echo "### 本次提交"
              git log --oneline -8 | sed 's/^/- /'
              echo ""
              echo "> 自动构建发布 · APK 见下方 Assets"
            } > "$RUNNER_TEMP/release-notes.md"
            echo "BODY_FILE=$RUNNER_TEMP/release-notes.md" >> "$GITHUB_ENV"
          fi

      - name: Publish Release (正式版)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VN }}
          name: RinCore v${{ env.VN }}
          body_path: ${{ env.BODY_FILE }}
          files: app/build/outputs/apk/research/*.apk
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
