name: Build RinCore APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 发布 Release 需要写权限
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # 生成 changelog 需要完整历史

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Node.js + pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install web-ui dependencies
        run: cd web-ui && pnpm install --no-frozen-lockfile

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install SDK components
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          sdkmanager "ndk;28.2.13676358" 2>/dev/null || true

      - name: Create signing config
        run: |
          # v3.8.30 安全收尾: 签名密钥移出仓库, 从 GitHub Secrets 注入
          # (仓库内不再存放任何 jks; secrets 未配置时跳过签名构建)
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ] || [ -z "${{ secrets.KEYSTORE_PASSWORD }}" ]; then
            echo "::warning::KEYSTORE secrets 未配置, 跳过 release 签名"
            printf 'storeFile=\nstorePassword=\nkeyAlias=\nkeyPassword=\n' > local.properties
          else
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release-key.jks
            printf 'storeFile=../app/release-key.jks\nstorePassword=%s\nkeyAlias=rincore\nkeyPassword=%s\n' "${{ secrets.KEYSTORE_PASSWORD }}" "${{ secrets.KEYSTORE_PASSWORD }}" > local.properties
          fi

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: rincore-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7

      # v3.11.1: 恢复有内容的推送格式 — 每次构建发布 Release 附本次变更说明
      - name: Compute version and changelog
        id: ver
        run: |
          VN=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          HEAD=$(git log -1 --pretty=%s)
          COMMITS=$(git log --oneline -10 | sed 's/^/- /')
          {
            echo "VN=$VN"
            echo "HEAD=$HEAD"
            echo "BODY<<EOF"
            echo "## $HEAD"
            echo ""
            echo "$COMMITS"
            echo ""
            echo "> 自动构建 Release，APK 见下方 Assets，CI artifact 与 nightly 同源可用。"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Publish Release with changelog
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v${{ env.VN }}
          name: RinCore v${{ env.VN }}
          body: ${{ env.BODY }}
          files: app/build/outputs/apk/release/*.apk
          prerelease: true
