# RinCore 单一发布链（2026-10-20 重建）
#
# 设计目标（用户定版：推送即版本、不推分支）：
#   一次 push main = gate(编译+测试) → build(assembleRelease) → release(正式版)
#   - gate 失败：不构建、不发布（历史红，修后同版重推）
#   - build 失败：不发布（gate 已挡掉绝大多数编译错）
#   - 成功：直接正式版（prerelease=false + make_latest），无需手动转正
#
# 与旧流程的差异：
#   1) 不再有 adopt→main 两段式（两轮 CI ≈25min → 单轮 ≈15min）
#   2) paths-ignore 根治 [skip ci] 陷阱（文档提交天然不触发）
#   3) Release 默认正式版（旧为 prerelease=true，每次还要手动 PATCH）
#   4) 发布说明优先读 docs/RELEASE-NOTES.md（rc release 自动生成），否则 commit 列表
name: Build & Release

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'
      - 'knowledge/**'
      - 'archive/**'
  workflow_dispatch:

permissions:
  contents: write

# 同一分支串行，避免两次推送并行构建互相覆盖 Release
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── 门禁：编译 + 测试 + 版本校验（≈4-6min） ─────────────
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Node.js + pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install web-ui deps
        run: cd web-ui && pnpm install --no-frozen-lockfile

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        continue-on-error: true

      - name: Install SDK components
        run: |
          export PATH="$(ls -d $ANDROID_HOME/cmdline-tools/*/bin | head -1):$PATH"
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" || true
          sdkmanager "platforms;android-37" "build-tools;37.0.0" 2>/dev/null || true
          sdkmanager "ndk;28.2.13676358" 2>/dev/null || true

      - name: Prepare dummy google-services.json (CI only)
        run: |
          if [ ! -f app/google-services.json ]; then
            printf '%s' '{"project_info":{"project_number":"0","project_id":"dev-oracle","storage_bucket":"dev-oracle.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:0:android:0","android_client_info":{"package_name":"me.rerere.rikkahub"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyDUMMY"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > app/google-services.json
          fi

      - name: Version check
        run: |
          VN=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          VC=$(grep -oP 'versionCode\s*=\s*\K\d+' app/build.gradle.kts || echo "?")
          echo "versionName=$VN versionCode=$VC"
          [ -n "$VN" ] || (echo "::error::versionName 为空" && exit 1)
          if git ls-remote --tags origin "refs/tags/v$VN" | grep -q .; then
            echo "::warning::tag v$VN 已存在（同版重推），Release 将被更新"
          fi

      - name: Release gates (ai test compile + markdown tests + app release compile)
        run: |
          ./gradlew :ai:compileDebugUnitTestKotlin --no-daemon --stacktrace
          ./gradlew :markdown:testDebugUnitTest --no-daemon --stacktrace
          ./gradlew :app:compileReleaseKotlin --no-daemon --stacktrace

  # ── 构建：真打包 + 签名（≈10-12min） ────────────────────
  build:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Node.js + pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install web-ui deps
        run: cd web-ui && pnpm install --no-frozen-lockfile

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        continue-on-error: true

      - name: Install SDK components
        run: |
          export PATH="$(ls -d $ANDROID_HOME/cmdline-tools/*/bin | head -1):$PATH"
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" || true
          sdkmanager "platforms;android-37" "build-tools;37.0.0" 2>/dev/null || true
          sdkmanager "ndk;28.2.13676358" 2>/dev/null || true

      - name: Prepare dummy google-services.json (CI only)
        run: |
          if [ ! -f app/google-services.json ]; then
            printf '%s' '{"project_info":{"project_number":"0","project_id":"dev-oracle","storage_bucket":"dev-oracle.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:0:android:0","android_client_info":{"package_name":"me.rerere.rikkahub"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyDUMMY"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > app/google-services.json
          fi

      - name: Create signing config
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ] || [ -z "${{ secrets.KEYSTORE_PASSWORD }}" ]; then
            echo "::warning::KEYSTORE secrets 未配置, 跳过 release 签名"
            printf 'storeFile=\nstorePassword=\nkeyAlias=\nkeyPassword=\n' > local.properties
          else
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release-key.jks
            printf 'storeFile=../app/release-key.jks\nstorePassword=%s\nkeyAlias=rincore\nkeyPassword=%s\n' "${{ secrets.KEYSTORE_PASSWORD }}" "${{ secrets.KEYSTORE_PASSWORD }}" > local.properties
          fi

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: rincore-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7

  # ── 发布：正式版一步到位（main only） ───────────────────
  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download APK
        uses: actions/download-artifact@v5
        with:
          name: rincore-release
          path: apk

      - name: Compute version and notes path
        id: ver
        run: |
          VN=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "VN=$VN" >> "$GITHUB_ENV"
          # 发布说明优先取仓库内 docs/RELEASE-NOTES.md（rc release 生成），否则现场合成
          if [ -s docs/RELEASE-NOTES.md ]; then
            echo "BODY_FILE=docs/RELEASE-NOTES.md" >> "$GITHUB_ENV"
          else
            {
              echo "## RinCore v$VN"
              echo ""
              echo "### 本次提交"
              git log --oneline -8 | sed 's/^/- /'
              echo ""
              echo "> 自动构建发布 · APK 见下方 Assets"
            } > "$RUNNER_TEMP/release-notes.md"
            echo "BODY_FILE=$RUNNER_TEMP/release-notes.md" >> "$GITHUB_ENV"
          fi
          echo "notes=$([ -s docs/RELEASE-NOTES.md ] && echo repo || echo generated)"

      - name: Publish Release (正式版)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VN }}
          name: RinCore v${{ env.VN }}
          body_path: ${{ env.BODY_FILE }}
          files: apk/*.apk
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
