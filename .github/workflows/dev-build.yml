# 实验分支 oracle（2026-10-20 起：主流程只推 main，本 workflow 仅供实验分支用手动触发）
# Dev build oracle for the reverse-adoption branch (adopt-3.0.0).
# Purpose: compile feedback for the 3.0.0 base swap + migration work.
# Does NOT publish releases and does NOT touch main.
name: Dev Build (adopt-3.0.0 oracle)

# ═══ v5.3.46 ★★只允许手动触发 ═══
# 此前这里还留着 `push: branches: [ "adopt-3.0.0" ]` —— 而文件头的注释从 2026-10-20
# 就写着「仅供实验分支用手动触发」。结果：每次发布后补推 adopt-3.0.0（rc release 只推 main），
# 都会再触发一次完整构建 → 用户看到「发布完立刻又推了一个一模一样的，唯一区别是 adopt-3.0.0」。
# 正式发版的编译验证已由 build.yml（监听 main）覆盖，这条自动触发纯属重复。
# 需要临时验证 adopt 分支时用 workflow_dispatch 手动跑。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Node.js + pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install web-ui deps (if present)
        run: |
          if [ -d web-ui ]; then cd web-ui && pnpm install --no-frozen-lockfile; else echo "no web-ui dir"; fi

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        continue-on-error: true

      - name: Install SDK components
        run: |
          export PATH="$(ls -d $ANDROID_HOME/cmdline-tools/*/bin | head -1):$PATH"
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" || true
          sdkmanager "platforms;android-37" "build-tools;37.0.0" 2>/dev/null || true
          sdkmanager "ndk;28.2.13676358" 2>/dev/null || true

      - name: Prepare dummy google-services.json (oracle only)
        run: |
          if [ ! -f app/google-services.json ]; then
            printf '%s' '{"project_info":{"project_number":"0","project_id":"dev-oracle","storage_bucket":"dev-oracle.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:0:android:0","android_client_info":{"package_name":"me.rerere.rikkahub"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyDUMMY"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > app/google-services.json
            echo "dummy google-services.json written"
          fi

      # 发布门禁预演（与 build.yml 同款硬门禁）：AI 测试源编译 + markdown 解析器测试
      - name: Release gates (ai test compile + markdown tests)
        run: |
          ./gradlew :ai:compileDebugUnitTestKotlin --no-daemon --stacktrace
          ./gradlew :markdown:testDebugUnitTest --no-daemon --stacktrace

      - name: Compile oracle (release-variant compile gate)
        run: |
          ./gradlew :app:compileReleaseKotlin --no-daemon --stacktrace
